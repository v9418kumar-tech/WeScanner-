<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ParulScanner</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:980px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}label{font-size:13px;color:#4b5563}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:16px}button{padding:11px 16px;border:0;border-radius:8px;background:#111827;color:#fff;font-size:16px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}.muted{color:#6b7280}.bad{color:#b42318}.ok{color:#087443}@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}}</style></head><body><div class="wrap"><h1>ParulScanner</h1><div class="muted">NSE Equity • ₹100+ • 1-minute volume scanner</div><div class="panel"><div class="controls"><div><label>Rows</label><input id="rows" type="number" inputmode="numeric" min="1" max="100" value="10"></div><div><label>Volume Multiplier</label><input id="mult" type="number" inputmode="decimal" min="0.1" step="0.1" value="3"></div><button id="scan">Scan / Refresh</button></div><p id="status" class="muted">Loading…</p></div><div class="panel"><table><thead><tr><th>Symbol</th><th>Price</th><th>1-min Vol</th><th>5-min Avg</th><th>×</th><th>Time</th></tr></thead><tbody id="body"><tr><td colspan="6">No data yet</td></tr></tbody></table></div></div><script>async function scan(){let rows=Math.max(1,Math.min(100,parseInt(rowsEl.value||10))),mult=Math.max(.1,parseFloat(multEl.value||3));status.textContent="Scanning…";try{let r=await fetch(`/api/scan?rows=${rows}&mult=${mult}`,{cache:"no-store"}),j=await r.json();if(!r.ok)throw Error(j.detail||j.error||"API error");status.textContent=`${j.mode} • ${j.scanned} instruments scanned • ${j.updated_at}`;status.className=j.connected?"ok":"muted";body.innerHTML="";(j.results||[]).forEach(x=>{let tr=document.createElement("tr");tr.innerHTML=`<td>${x.symbol}</td><td>₹${Number(x.price).toFixed(2)}</td><td>${Number(x.volume).toLocaleString("en-IN")}</td><td>${Number(x.avg5).toLocaleString("en-IN")}</td><td>${Number(x.multiplier).toFixed(1)}×</td><td>${x.time||""}</td>`;body.appendChild(tr)});if(!j.results?.length)body.innerHTML="<tr><td colspan=6>No shares matched.</td></tr>"}catch(e){status.textContent="API error: "+e.message;status.className="bad"}}const rowsEl=document.getElementById("rows"),multEl=document.getElementById("mult"),status=document.getElementById("status"),body=document.getElementById("body");document.getElementById("scan").onclick=scan;scan();setInterval(scan,60000);</script></body></html>
